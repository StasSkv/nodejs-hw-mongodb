openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    This is the backend of the application for managing users' personal contacts.
    Implemented on Node.js using Express and MongoDB.
    Supports full CRUD functionality for contacts, as well as an authentication system using sessions and authorization via Bearer tokens.
    Each contact belongs to a specific user, which ensures privacy and data security.

tags:
  - name: Contacts
    description: Contacts API
  - name: Auth
    description: Authentication API

servers:
  - url: http://localhost:3000
  - url: https://contacts-app-esuc.onrender.com

paths:
  /contacts:
    get:
      $ref: './swagger/paths/contacts/get.yaml'
    post:
      $ref: './swagger/paths/contacts/post.yaml'
  /contacts/{id}:
    get:
      $ref: './swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: './swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: './swagger/paths/contacts/{id}/delete.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []
