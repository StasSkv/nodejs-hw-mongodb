type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: 'Contact id'
    type: string
    example: '65ca67e7ae7f10c88b598384'
  name:
    description: 'Contact name'
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Contact phone number'
    type: string
    example: '+380991234567'
  email:
    description: 'Contact email'
    type: string
    example: 'john.doe@example.com'
  isFavourite:
    description: 'Is contact favourite'
    type: boolean
    example: true
  contactType:
    description: 'Contact type'
    type: string
    enum: ['work', 'home', 'personal']
    default: personal
  userId:
    description: 'User id'
    type: string
    example: '65ca67e7ae7f10c88b598384'
  photo:
    description: 'Link to contact photo'
    type: string
    example: 'https://res.cloudinary.com/dffn8ggis/image/upload/v1751317636/cdgtityu3so9bcmriyv1.png'
