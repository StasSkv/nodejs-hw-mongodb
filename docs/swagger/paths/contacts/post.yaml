tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact with payload
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: Contact name
            type: string
            example: John Doe
          phoneNumber:
            description: Contact phone number
            type: string
            example: '+380991234567'
          email:
            description: Contact email
            type: string
            example: 'john.doe@example.com'
          isFavourite:
            description: Is contact favourite
            type: boolean
            example: true
          contactType:
            description: Contact type
            type: string
            enum: [work, home, personal]
            example: work
          photo:
            description: Contact photo
            type: string
            format: binary
responses:
  '201':
    description: Create a new contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
